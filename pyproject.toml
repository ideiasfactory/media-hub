[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "backend", "bff", "frontend", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "S",   # flake8-bandit (subset in ruff)
]
ignore = [
  "S101",  # assert OK em testes
  "UP017", # timezone.utc (compatível; datetime.UTC exige 3.11+)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "output"]
skips = ["B101"]
