<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Baixe e transcreva o áudio de vídeos públicos do YouTube.">
    <title>Media Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="brand-mark" aria-hidden="true">▶</div>
        <div>
          <p class="eyebrow">YouTube Web MVP</p>
          <h1>Media Hub</h1>
          <p class="lede">Transforme o áudio de um vídeo público em uma transcrição pronta para usar.</p>
        </div>
      </header>

      <section class="card">
        <form id="job-form">
          <label for="url">URL do YouTube</label>
          <input id="url" name="url" type="url" required
            placeholder="https://www.youtube.com/watch?v=..." autocomplete="url">
          <div class="form-grid">
            <div>
              <label for="model">Modelo Whisper</label>
              <select id="model" name="model">
                <option value="tiny">Tiny — mais rápido</option>
                <option value="base" selected>Base — equilibrado</option>
                <option value="small">Small — mais preciso</option>
              </select>
            </div>
            <div>
              <label for="language">Idioma</label>
              <select id="language" name="language">
                <option value="autodetect" selected>Autodetectar</option>
                <option value="pt">Português</option>
                <option value="en">Inglês</option>
                <option value="es">Espanhol</option>
              </select>
            </div>
          </div>
          <button id="submit-button" type="submit">Baixar e Transcrever</button>
          <p class="legal">Processe somente conteúdo próprio, autorizado ou permitido pelos termos aplicáveis.</p>
        </form>
      </section>

      <section id="status-panel" class="card status-card" aria-live="polite">
        <div class="status-heading">
          <div>
            <p class="eyebrow">Status</p>
            <h2 id="status-label">Aguardando</h2>
          </div>
          <span id="progress-label">0%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-bar"></div>
        </div>
        <p id="status-message">Cole uma URL para começar.</p>
      </section>

      <section id="result-panel" class="card result-card" hidden>
        <p class="eyebrow">Resultado</p>
        <h2 id="video-title"></h2>
        <dl class="metadata">
          <div><dt>Canal</dt><dd id="video-channel"></dd></div>
          <div><dt>Duração</dt><dd id="video-duration"></dd></div>
          <div><dt>Idioma</dt><dd id="video-language"></dd></div>
        </dl>
        <div id="downloads" class="downloads"></div>
        <div class="transcript-heading">
          <h3>Transcrição completa</h3>
          <button id="copy-transcript" class="copy-button" type="button"
            aria-label="Copiar transcrição completa" title="Copiar transcrição">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
              <path d="M8 7V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/>
              <rect x="4" y="7" width="12" height="14" rx="2"/>
            </svg>
            <span class="copy-label">Copiar</span>
          </button>
        </div>
        <div id="transcript" class="transcript"></div>
      </section>
    </main>
    <script src="{{ url_for('static', path='/app.js') }}" defer></script>
  </body>
</html>
