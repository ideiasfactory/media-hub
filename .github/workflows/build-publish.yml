name: Build and publish image

# Build once → GHCR (ADR-027 / ADR-030). Digest is the immutable identity.
# PR: build only (no push). main / tags v* / workflow_dispatch: push when allowed.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_image:
        description: Push image to GHCR
        type: boolean
        default: true

concurrency:
  group: build-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ideiasfactory/media-hub

jobs:
  build:
    name: Build (and publish) GHCR image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Decide push
        id: push
        run: |
          push=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.push_image }}" == "true" ]]; then
              push=true
            fi
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            push=true
          fi
          echo "push=${push}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.push.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # No floating `latest` as sole identity (ADR-030).
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch,prefix=branch-
            type=sha,prefix=sha-,format=short
            type=raw,value=dev-${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.push.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        if: always()
        run: |
          {
            echo "## Image build"
            echo ""
            echo "- Push: \`${{ steps.push.outputs.push }}\`"
            echo "- Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            if [[ -n "${{ steps.build.outputs.digest }}" ]]; then
              echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
              echo "- Promote with: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
